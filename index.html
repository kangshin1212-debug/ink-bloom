<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ink Bloom — 잉크 번짐 캔버스</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1c1a17;
  }

  #board {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }

  .hint {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    letter-spacing: 0.02em;
    background: rgba(0, 0, 0, 0.25);
    padding: 6px 14px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .hint.hidden { opacity: 0; }

  .panel {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 12px 20px;
    background: rgba(20, 18, 16, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    max-width: 94vw;
    overflow-x: auto;
  }

  .group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .group-label {
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .row { display: flex; gap: 8px; }

  .paper-btn {
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .paper-btn:hover { background: rgba(255, 255, 255, 0.12); }

  .paper-btn.active {
    background: rgba(255, 255, 255, 0.9);
    color: #1c1a17;
    border-color: transparent;
  }

  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.15);
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .swatch:hover { transform: scale(1.1); }

  .swatch.active {
    border-color: rgba(255, 255, 255, 0.9);
    transform: scale(1.12);
  }

  .brush-group input[type="range"] {
    width: 120px;
    accent-color: #e9c46a;
  }

  .actions {
    flex-direction: row;
    gap: 8px;
    align-items: center;
  }

  .actions button {
    padding: 7px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.85);
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .actions button:hover { background: rgba(255, 255, 255, 0.16); }

  @media (max-width: 640px) {
    .panel { gap: 14px; padding: 10px 14px; bottom: 12px; }
    .brush-group input[type="range"] { width: 80px; }
    .hint { font-size: 11.5px; top: 12px; }
  }
</style>
</head>
<body>
  <canvas id="board"></canvas>

  <div class="hint" id="hint">마우스나 손가락으로 화면을 문질러 보세요 · 톡 치면 큰 번짐이 생겨요</div>

  <div class="panel">
    <div class="group">
      <span class="group-label">종이</span>
      <div class="row" id="paperButtons">
        <button class="paper-btn" data-mode="light">밝은 종이</button>
        <button class="paper-btn" data-mode="dark">어두운 종이</button>
      </div>
    </div>

    <div class="group">
      <span class="group-label">색감</span>
      <div class="row" id="paletteSwatches"></div>
    </div>

    <div class="group brush-group">
      <span class="group-label">브러시</span>
      <input type="range" id="brushSize" min="8" max="70" value="30">
    </div>

    <div class="group actions">
      <button id="clearBtn" title="캔버스 지우기">지우기</button>
      <button id="saveBtn" title="PNG로 저장">저장</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  const paperButtons = document.getElementById("paperButtons");
  const paletteSwatches = document.getElementById("paletteSwatches");
  const brushSize = document.getElementById("brushSize");
  const clearBtn = document.getElementById("clearBtn");
  const saveBtn = document.getElementById("saveBtn");

  const PAPERS = {
    light: {
      bg: "#f3ece0",
      blend: "multiply",
      palettes: [
        { name: "먹", colors: [{ h: 20, s: 15, l: 12 }, { h: 20, s: 10, l: 25 }] },
        { name: "인디고", colors: [{ h: 230, s: 55, l: 30 }, { h: 250, s: 40, l: 45 }] },
        { name: "홍시", colors: [{ h: 8, s: 70, l: 45 }, { h: 25, s: 75, l: 55 }] },
        { name: "숲", colors: [{ h: 140, s: 40, l: 28 }, { h: 95, s: 35, l: 40 }] },
      ],
    },
    dark: {
      bg: "#15131a",
      blend: "lighter",
      palettes: [
        { name: "네온", colors: [{ h: 300, s: 90, l: 60 }, { h: 190, s: 95, l: 60 }] },
        { name: "오로라", colors: [{ h: 160, s: 85, l: 55 }, { h: 210, s: 90, l: 60 }] },
        { name: "선셋", colors: [{ h: 20, s: 95, l: 60 }, { h: 340, s: 85, l: 60 }] },
        { name: "금빛", colors: [{ h: 45, s: 90, l: 60 }, { h: 15, s: 80, l: 55 }] },
      ],
    },
  };

  let paperMode = "light";
  let paletteIndex = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const activeBlooms = [];

  function hsla(h, s, l, a) {
    return `hsla(${h}, ${s}%, ${l}%, ${a})`;
  }

  function currentPalette() {
    return PAPERS[paperMode].palettes[paletteIndex];
  }

  function fillBackground() {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = PAPERS[paperMode].bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function resize(preserve = true) {
    const snapshot = preserve && canvas.width > 0 ? canvas.toDataURL() : null;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fillBackground();
    if (snapshot) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, w, h);
      img.src = snapshot;
    }
  }

  function clearCanvas() {
    activeBlooms.length = 0;
    resize(false);
  }

  function makeRadii(n) {
    const radii = [];
    for (let i = 0; i < n; i++) {
      let r = 0.55 + Math.random() * 0.5;
      if (Math.random() < 0.3) r *= 1.35;
      radii.push(r);
    }
    return radii;
  }

  function blobPath(cx, cy, radii, radius, wobble, t) {
    const n = radii.length;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const w = 1 + (wobble ? 0.06 * Math.sin(t * 5 + i * 1.7) * (1 - t) : 0);
      const r = radius * radii[i] * w;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    ctx.beginPath();
    const m0 = mid(pts[n - 1], pts[0]);
    ctx.moveTo(m0[0], m0[1]);
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const next = pts[(i + 1) % n];
      const m = mid(p, next);
      ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]);
    }
    ctx.closePath();
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  function spawnBloom(x, y, sizeMul = 1) {
    const palette = currentPalette();
    const base = palette.colors[Math.floor(Math.random() * palette.colors.length)];
    const h = base.h + (Math.random() - 0.5) * 14;
    const s = Math.max(0, Math.min(100, base.s + (Math.random() - 0.5) * 12));
    const l = Math.max(0, Math.min(100, base.l + (Math.random() - 0.5) * 10));
    const size = Number(brushSize.value);
    const radius = (size * (0.7 + Math.random() * 0.6)) * sizeMul;
    const bloom = {
      x, y, radius,
      hsl: { h, s, l },
      alpha: paperMode === "light" ? 0.5 + Math.random() * 0.18 : 0.65 + Math.random() * 0.2,
      radii: makeRadii(9 + Math.floor(Math.random() * 4)),
      duration: 550 + radius * 9 + Math.random() * 250,
      start: performance.now(),
    };
    activeBlooms.push(bloom);
    scatterSplatter(x, y, radius, bloom.hsl, bloom.alpha);
  }

  function scatterSplatter(x, y, radius, hsl, alpha) {
    ctx.globalCompositeOperation = PAPERS[paperMode].blend;
    const count = Math.floor(radius / 4) + 3;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const dist = radius * (0.9 + Math.random() * 0.7);
      const px = x + Math.cos(a) * dist;
      const py = y + Math.sin(a) * dist;
      const r = 0.6 + Math.random() * 2.2;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = hsla(hsl.h, hsl.s, hsl.l, alpha * (0.3 + Math.random() * 0.4));
      ctx.fill();
    }
  }

  function drawBloom(bloom, now) {
    const t = Math.min(1, (now - bloom.start) / bloom.duration);
    const rGrow = easeOutCubic(t);
    const aGrow = easeOutQuad(Math.min(1, t * 1.6));
    ctx.globalCompositeOperation = PAPERS[paperMode].blend;
    const grad = ctx.createRadialGradient(
      bloom.x, bloom.y, 0,
      bloom.x, bloom.y, bloom.radius * rGrow
    );
    const { h, s, l } = bloom.hsl;
    const a = bloom.alpha * aGrow;
    grad.addColorStop(0, hsla(h, s, l, a));
    grad.addColorStop(0.7, hsla(h, s, l, a * 0.85));
    grad.addColorStop(1, hsla(h, s, l, a * 0.15));
    ctx.fillStyle = grad;
    blobPath(bloom.x, bloom.y, bloom.radii, bloom.radius * rGrow, true, t);
    ctx.fill();
    return t >= 1;
  }

  function frame() {
    const now = performance.now();
    for (let i = activeBlooms.length - 1; i >= 0; i--) {
      const done = drawBloom(activeBlooms[i], now);
      if (done) activeBlooms.splice(i, 1);
    }
    requestAnimationFrame(frame);
  }

  let dragging = false;
  let downTime = 0;
  let downPos = { x: 0, y: 0 };
  let lastSpawn = { x: 0, y: 0, t: 0 };
  let moved = false;

  function toLocal(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function hideHint() { hint.classList.add("hidden"); }

  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = false;
    downTime = performance.now();
    const p = toLocal(e);
    downPos = p;
    lastSpawn = { x: p.x, y: p.y, t: 0 };
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const p = toLocal(e);
    const dx = p.x - lastSpawn.x;
    const dy = p.y - lastSpawn.y;
    const dist = Math.hypot(dx, dy);
    const now = performance.now();
    if (dist > 18 || now - lastSpawn.t > 90) {
      if (Math.hypot(p.x - downPos.x, p.y - downPos.y) > 6) moved = true;
      const speed = Math.min(1.4, dist / 40);
      spawnBloom(p.x, p.y, 0.6 + speed * 0.5);
      lastSpawn = { x: p.x, y: p.y, t: now };
      hideHint();
    }
  });

  function finishStroke(e) {
    if (!dragging) return;
    dragging = false;
    const p = toLocal(e);
    const heldShort = performance.now() - downTime < 220;
    if (heldShort && !moved) {
      spawnBloom(p.x, p.y, 2.1);
      hideHint();
    }
  }

  canvas.addEventListener("pointerup", finishStroke);
  canvas.addEventListener("pointercancel", finishStroke);
  canvas.addEventListener("pointerleave", (e) => {
    if (dragging && e.buttons === 0) finishStroke(e);
  });

  function renderPalettes() {
    paletteSwatches.innerHTML = "";
    PAPERS[paperMode].palettes.forEach((p, i) => {
      const btn = document.createElement("button");
      btn.className = "swatch" + (i === paletteIndex ? " active" : "");
      btn.title = p.name;
      const c1 = p.colors[0];
      const c2 = p.colors[1];
      btn.style.background = `linear-gradient(135deg, ${hsla(c1.h, c1.s, c1.l, 1)}, ${hsla(c2.h, c2.s, c2.l, 1)})`;
      btn.addEventListener("click", () => {
        paletteIndex = i;
        renderPalettes();
      });
      paletteSwatches.appendChild(btn);
    });
  }

  function setPaperMode(mode) {
    paperMode = mode;
    paletteIndex = 0;
    [...paperButtons.children].forEach((b) =>
      b.classList.toggle("active", b.dataset.mode === mode)
    );
    renderPalettes();
    clearCanvas();
  }

  paperButtons.addEventListener("click", (e) => {
    const btn = e.target.closest(".paper-btn");
    if (btn) setPaperMode(btn.dataset.mode);
  });

  clearBtn.addEventListener("click", () => clearCanvas());

  saveBtn.addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = `ink-bloom-${Date.now()}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  window.addEventListener("resize", () => resize(true));

  setPaperMode("light");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
